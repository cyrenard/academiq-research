name: CI

on:
  push:
    branches: [main, master, experiment/**, agent/**]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Linux Tauri test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install platform sidecar dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src-sidecar/capture-agent

      - name: Build platform capture sidecar
        run: node scripts/build-sidecar.js

      - name: Prepare platform Tauri icon
        if: runner.os == 'Linux'
        run: cp icon.png src-tauri/icons/icon.png

      - name: Install platform PDFium runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="pdfium-linux-x64.tgz"
          library="libpdfium.so"
          curl -L --retry 3 -o "/tmp/$archive" \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/$archive"
          mkdir -p /tmp/academiq-pdfium
          tar -xzf "/tmp/$archive" -C /tmp/academiq-pdfium
          cp "$(find /tmp/academiq-pdfium -name "$library" -print -quit)" \
            "src-tauri/binaries/$library"

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (main-process + legacy)
        run: npm test
        env:
          # Tests share globals; suppress noisy main-process logs
          NODE_NO_WARNINGS: '1'

      - name: Renderer tests (Vitest + Testing Library)
        run: npm run test:renderer

      - name: Editor stability gate
        run: npm run gate:editor

  build-renderer:
    name: Build renderer (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vite build
        run: npm run build:renderer

      - name: Upload renderer bundle
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ github.sha }}
          path: dist/renderer/
          retention-days: 7
          if-no-files-found: error
