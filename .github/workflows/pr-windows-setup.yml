name: PR Windows Setup

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-windows-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-setup:
    name: Build unsigned Windows setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build unsigned NSIS installer
        run: npm run build
        env:
          ACADEMIQ_SKIP_SIGN: "1"

      - name: Validate installer bundle
        run: node scripts/tauri-bundle-gate.js
        env:
          ACADEMIQ_SKIP_SIGN: "1"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcademiQ-Setup-${{ github.event.pull_request.number || github.run_number }}
          path: |
            dist/tauri/*.exe
            dist/tauri/SHA256SUMS.txt
            dist/tauri/latest.json
          if-no-files-found: error
          retention-days: 7
